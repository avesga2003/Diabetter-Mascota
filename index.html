<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GlukoPet - Mi Compañero de Aventuras</title>
    <link rel="stylesheet" href="cssstyle.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas Principal del Juego -->
        <canvas id="gameCanvas"></canvas>

        <!-- Interfaz de Usuario (HUD) Superpuesta -->
    <div id="hud-layer" class="ui-screen">
        
        <div class="hud-top">
            <div class="stat-bar-container">
                <img src="assets/images/ico_salud.png" alt="Salud" class="stat-icon-img">
                <div class="bar-bg"><div id="bar-health" class="bar-fill health"></div></div>
                <span class="stat-percentage" id="txt-health">100%</span>
            </div>
            
            <div class="stat-bar-container">
                <img src="assets/images/ico_hambre.png" alt="Hambre" class="stat-icon-img">
                <div class="bar-bg"><div id="bar-hunger" class="bar-fill hunger"></div></div>
                <span class="stat-percentage" id="txt-hunger">55%</span>
            </div>
            
            <div class="stat-bar-container">
                <img src="assets/images/ico_energia.png" alt="Energía" class="stat-icon-img">
                <div class="bar-bg"><div id="bar-energy" class="bar-fill energy"></div></div>
                <span class="stat-percentage" id="txt-energy">90%</span>
            </div>

            <div class="gluko-meter" id="gluko-display">
                <div class="gluko-header">Glucosa</div>
                <div class="gluko-body">
                    <img src="assets/images/ico_gota.png" alt="Glucosa" class="gluko-icon-img">
                    <span id="gluko-value">131</span>
                    <span class="unit">mg/dL</span>
                    <div id="gluko-trend-box"><img src="assets/images/arrow_stable.png" id="gluko-trend-img" alt="Tendencia"></div>
                </div>
            </div>
        </div>

        <div id="educational-alert" class="hidden">
            <p id="alert-text">¡Hola! Vamos a jugar juntos hoy.</p>
            <button id="alert-close-btn" onclick="ui.hideAlert()">¡Entendido!</button>
        </div>

        <div class="hud-bottom grid-2x2">
            <button class="action-btn" onclick="game.openMenu('food')">
                <img src="assets/images/btn_comer.png" alt="Comer" class="btn-icon-img"> Comer
            </button>
            <button class="action-btn" onclick="game.openMenu('insulin')">
                <img src="assets/images/btn_insulina.png" alt="Insulina" class="btn-icon-img"> Insulina
            </button>
            <button class="action-btn" onclick="game.toggleSleep()">
                <img src="assets/images/btn_dormir.png" alt="Dormir" class="btn-icon-img"> Dormir
            </button>
            <button class="action-btn" onclick="game.playMinigame()">
                <img src="assets/images/btn_jugar.png" alt="Jugar" class="btn-icon-img"> Jugar
            </button>
        </div>
    </div>
        <!-- Menú Desplegable de Alimentos -->
        <div id="food-menu" class="modal hidden">
            <div class="modal-content">
                <h3>¿Qué vamos a comer?</h3>
                <div class="food-grid" id="food-grid-container"></div>
                <button class="close-modal-btn" onclick="ui.closeModals()">Cerrar</button>
            </div>
        </div>

        <!-- Menú de Insulina / Corrección -->
        <div id="insulin-menu" class="modal hidden">
            <div class="modal-content">
                <h3>Bolo de Insulina 💉</h3>
                <p class="educational-note">La insulina ayuda a que la energía de los alimentos entre a las células de tu mascota.</p>
                <div class="insulin-options">
                    <button class="ins-btn dose-micro" onclick="game.administerInsulin(1)">Dosis Pequeña (1U)</button>
                    <button class="ins-btn dose-med" onclick="game.administerInsulin(3)">Dosis Mediana (3U)</button>
                </div>
                <button class="close-modal-btn" onclick="ui.closeModals()">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts Modulares -->
    <script src="js/jsaudio.js"></script>
    <script src="js/jssaveSystem.js"></script>
    <script src="js/jsstats.js"></script>
    <script src="js/jsfoodSystem.js"></script>
    <script src="js/jsanimations.js"></script>
    <script src="js/jspet.js"></script>
    <script src="js/jsui.js"></script>
    <script src="js/jsgame.js"></script>
</body>
</html>
